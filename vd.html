<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieMenu - Chạy thử API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .food-card { transition: transform 0.3s; }
        .food-card:hover { transform: scale(1.05); }
        .badge-out { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">FoodieMenu Test API</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="text-center mb-4">Thực đơn nhà hàng</h2>
        
        <div id="dish-list" class="row g-4">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Đang tải dữ liệu...</span>
                </div>
                <p>Đang kết nối tới MockAPI của bạn...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Khai báo URL API của bạn
        const API_URL = "https://69fc37acfce564e259177ad6.mockapi.io/api/v1/dishes";

        // 2. Hàm lấy dữ liệu từ API
        async function loadDishes() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Không thể kết nối API");
                
                const dishes = await response.json();
                renderDishes(dishes);
            } catch (error) {
                document.getElementById('dish-list').innerHTML = `
                    <div class="alert alert-danger">Lỗi: ${error.message}. Hãy kiểm tra xem bạn đã tạo resource 'dishes' trên MockAPI chưa!</div>
                `;
            }
        }

        // 3. Hàm hiển thị dữ liệu lên giao diện (HTML)
        function renderDishes(dishes) {
            const listContainer = document.getElementById('dish-list');
            listContainer.innerHTML = ''; // Xóa dòng chữ "Đang tải"

            if (dishes.length === 0) {
                listContainer.innerHTML = '<p class="text-center">Chưa có món ăn nào. Hãy nhấn "Generate" trên MockAPI!</p>';
                return;
            }

            dishes.forEach(dish => {
                // Kiểm tra nếu quantity = 0 thì hiện badge Hết món
                const statusBadge = (dish.Quantity == 0) ? 
                    `<span class="badge badge-out position-absolute top-0 end-0 m-2">Hết món</span>` : '';

                // Tạo cấu trúc thẻ Card cho từng món ăn
                const cardHTML = `
                    <div class="col-md-4 col-lg-3">
                        <div class="card h-100 food-card shadow-sm position-relative">
                            ${statusBadge}
                            <img src="${dish.Picture || 'https://via.placeholder.com/300x200'}" class="card-img-top" alt="${dish.Name}">
                            <div class="card-body">
                                <h5 class="card-title text-truncate">${dish.Name}</h5>
                                <p class="card-text text-muted small text-truncate">${dish.Description}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="text-danger fw-bold">${Number(dish.Price).toLocaleString()}đ</span>
                                    <small class="text-muted">Kho: ${dish.Quantity}</small>
                                </div>
                            </div>
                            <div class="card-footer bg-white border-0 pb-3">
                                <button class="btn btn-outline-primary btn-sm w-100">Xem chi tiết</button>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += cardHTML;
            });
        }

        // Tự động chạy khi trang web vừa mở lên
        loadDishes();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html

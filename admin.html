<!-- admin.html -->

<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodieMenu Admin</title>

    <!-- BOOTSTRAP -->

    <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="./css/style.css">

</head>

<body>


    <div class="wrapper">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2 class="logo">

                🍜 FoodieMenu

            </h2>

            <ul>

                <li class="active">
                    <i class="fa-solid fa-utensils"></i>
                    Quản lý món ăn
                </li>

                <li>
                    <i class="fa-solid fa-list"></i>
                    Danh mục
                </li>

                <li>
                    <i class="fa-solid fa-chart-line"></i>
                    Thống kê
                </li>

                <li>
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Đăng xuất
                </li>

            </ul>

        </aside>


        <!-- MAIN -->

        <main class="main-content">


            <!-- TOP -->

            <div class="top-bar">

                <div>

                    <h1>
                        Quản lý món ăn
                    </h1>

                    <p>
                        Thêm, sửa, xóa món ăn trong thực đơn
                    </p>

                </div>

                <button class="btn btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#foodModal">

                    <i class="fa-solid fa-plus"></i>

                    Thêm món ăn

                </button>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <input type="text"
                       id="searchInput"
                       class="form-control"
                       placeholder="Tìm món ăn...">

            </div>


            <!-- LOADING -->

            <div class="text-center my-4"
                 id="loading">

                <div class="spinner-border text-success">

                </div>

            </div>


            <!-- TABLE -->

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>Ảnh</th>
<th>Tên món</th>

                            <th>Danh mục</th>

                            <th>Giá</th>

                            <th>Đánh giá</th>

                            <th>Thao tác</th>

                        </tr>

                    </thead>

                    <tbody id="foodTable">

                    </tbody>

                </table>

            </div>

        </main>

    </div>


    <!-- MODAL -->

    <div class="modal fade"
         id="foodModal">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">

                        Thêm món ăn

                    </h5>

                    <button class="btn-close"
                            data-bs-dismiss="modal">

                    </button>

                </div>

                <div class="modal-body">


                    <form id="foodForm">


                        <!-- TEN MON -->

                        <div class="mb-3">

                            <label class="form-label">

                                Tên món ăn

                            </label>

                            <input type="text"
                                   id="TenMon"
                                   class="form-control">

                            <small class="text-danger"
                                   id="errorTenMon">

                            </small>

                        </div>


                        <!-- GIA -->

                        <div class="mb-3">

                            <label class="form-label">

                                Giá món ăn

                            </label>

                            <input type="number"
                                   id="Gia"
                                   class="form-control">

                            <small class="text-danger"
                                   id="errorGia">

                            </small>

                        </div>


                        <!-- DANH MUC -->

                        <div class="mb-3">

                            <label class="form-label">

                                Danh mục

                            </label>

                            <select id="DanhMuc"
                                    class="form-select">

                                <option value="">
                                    Chọn danh mục
                                </option>

                                <option>
                                    Phở
                                </option>

                                <option>
                                    Bún
                                </option>

                                <option>
                                    Cơm tấm
                                </option>

                                <option>
Cơm thố
                                </option>

                                <option>
                                    Lẩu
                                </option>

                                <option>
                                    Đồ uống
                                </option>

                            </select>

                        </div>


                        <!-- HINH -->

                        <div class="mb-3">

                            <label class="form-label">

                                Link hình ảnh

                            </label>

                            <input type="text"
                                   id="HinhAnh"
                                   class="form-control">

                        </div>


                        <!-- DANH GIA -->

                        <div class="mb-3">

                            <label class="form-label">

                                Đánh giá

                            </label>

                            <input type="text"
                                   id="DanhGia"
                                   class="form-control">

                        </div>


                        <!-- MO TA -->

                        <div class="mb-3">

                            <label class="form-label">

                                Mô tả

                            </label>

                            <textarea id="MoTa"
                                      class="form-control">

                            </textarea>

                        </div>


                        <button class="btn btn-success">

                            Lưu món ăn

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- JQUERY -->

    <script
            src="https://code.jquery.com/jquery-3.7.1.min.js">

    </script>


    <!-- BOOTSTRAP -->

    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    </script>


    <!-- JS -->

    <script src="js/admin.js"></script>

</body>

</html>

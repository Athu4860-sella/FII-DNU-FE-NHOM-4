<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin - FoodieMenu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> ⚙️ Admin FoodieMenu </a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Quản lý món ăn</h2>

        <button
          class="btn btn-danger"
          data-bs-toggle="modal"
          data-bs-target="#dishModal"
        >
          Thêm món
        </button>
      </div>

      <!-- TABLE -->
      <div class="table-responsive shadow-sm">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Tên</th>
              <th>Giá</th>
              <th>Danh mục</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>

          <tbody id="adminDishList"></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="dishModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="dishForm">
            <div class="modal-header">
              <h5 class="modal-title">Thêm món ăn</h5>

              <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="dishId" />

              <!-- NAME -->
              <div class="mb-3">
                <label class="form-label"> Tên món </label>

                <input type="text" id="name" class="form-control" />

                <small class="text-danger" id="nameError"></small>
              </div>

              <!-- PRICE -->
              <div class="mb-3">
                <label class="form-label"> Giá </label>

                <input type="number" id="price" class="form-control" />

                <small class="text-danger" id="priceError"></small>
              </div>

              <!-- IMAGE -->
              <div class="mb-3">
                <label class="form-label"> URL ảnh </label>

                <input type="text" id="image" class="form-control" />

                <small class="text-danger" id="imageError"></small>
              </div>

              <!-- CATEGORY -->
              <div class="mb-3">
                <label class="form-label"> Danh mục </label>

                <select id="category" class="form-select">
                  <option value="Món chính">Món chính</option>
                  <option value="Đồ uống">Đồ uống</option>
                  <option value="Tráng miệng">Tráng miệng</option>
                </select>
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">
                Đóng
              </button>

              <button class="btn btn-danger" type="submit">Lưu</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
      <div id="liveToast" class="toast">
        <div class="toast-body">Thành công</div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/admin.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

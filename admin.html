<!-- admin.html -->

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>⚙️ FoodieMenu Admin</title>

    <!-- BOOTSTRAP -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FONT AWESOME -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- GOOGLE FONT -->

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- ADMIN PAGE -->

    <div class="wrapper" id="adminPage">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <a href="index.html" class="logo text-decoration-none text-light">
          <h2 class="logo">🍜 FoodieMenu</h2>
        </a>
        <ul>
          <li class="active">
            <i class="fa-solid fa-utensils"></i>

            Quản lý món ăn
          </li>

          <li>
            <i class="fa-solid fa-list"></i>

            Danh mục
          </li>

          <li>
            <i class="fa-solid fa-chart-line"></i>

            Thống kê
          </li>

          <li onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>

            Đăng xuất
          </li>
        </ul>
      </aside>

      <!-- MAIN -->

      <main class="main-content">
        <!-- TOP BAR -->

        <div class="top-bar">
          <div>
            <h1>Quản lý món ăn</h1>

            <p>Thêm, sửa, xóa món ăn trong thực đơn</p>
          </div>

          <!-- BUTTON ADD -->

          <button
            class="btn btn-success"
            data-bs-toggle="modal"
            data-bs-target="#foodModal"
          >
            <i class="fa-solid fa-plus"></i>

            Thêm món ăn
          </button>
        </div>

        <!-- SEARCH -->

        <div class="search-box mb-4">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Tìm món ăn..."
          />
        </div>

        <!-- LOADING -->

        <div class="text-center my-4" id="loading">
          <div class="spinner-border text-success"></div>
        </div>

        <!-- TABLE -->

        <div class="table-responsive">
          <table class="table align-middle table-bordered">
            <thead class="table-success">
              <tr>
                <th>#</th>

                <th>Ảnh</th>

                <th>Tên món</th>

                <th>Danh mục</th>

                <th>Giá</th>

                <th>Đánh giá</th>

                <th>Thao tác</th>
              </tr>
            </thead>

            <tbody id="foodTable"></tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- MODAL -->

    <div class="modal fade" id="foodModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <!-- HEADER -->

          <div class="modal-header">
            <h5 class="modal-title">Thêm món ăn</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- BODY -->

          <div class="modal-body">
            <form id="foodForm">
              <!-- TÊN -->

              <div class="mb-3">
                <label class="form-label"> Tên món ăn </label>

                <input
                  type="text"
                  id="TenMon"
                  class="form-control"
                  placeholder="Nhập tên món ăn"
                />
              </div>

              <!-- GIÁ -->

              <div class="mb-3">
                <label class="form-label"> Giá món ăn </label>

                <input
                  type="number"
                  id="Gia"
                  class="form-control"
                  placeholder="Nhập giá món ăn"
                />
              </div>

              <!-- DANH MỤC -->

              <div class="mb-3">
                <label class="form-label"> Danh mục </label>

                <select id="DanhMuc" class="form-select">
                  <option value="">Chọn danh mục</option>
                </select>
              </div>

              <!-- HÌNH -->

              <div class="mb-3">
                <label class="form-label"> Link hình ảnh </label>

                <input
                  type="text"
                  id="HinhAnh"
                  class="form-control"
                  placeholder="Dán link ảnh"
                />
              </div>

              <!-- ĐÁNH GIÁ -->

              <div class="mb-3">
                <label class="form-label"> Đánh giá </label>

                <input
                  type="number"
                  id="DanhGia"
                  class="form-control"
                  placeholder="1 - 5"
                  min="0"
                  max="5"
                  step="0.1"
                />
              </div>

              <!-- MÔ TẢ -->

              <div class="mb-3">
                <label class="form-label"> Mô tả </label>

                <textarea
                  id="MoTa"
                  class="form-control"
                  rows="4"
                  placeholder="Nhập mô tả món ăn"
                ></textarea>
              </div>

              <!-- BUTTON -->

              <button class="btn btn-success w-100">Lưu món ăn</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- JQUERY -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- BOOTSTRAP -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- UTILS -->

    <script src="./js/utils.js"></script>

    <!-- ADMIN JS -->

    <script src="./js/admin.js"></script>
  </body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚙️ FoodieMenu Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div class="wrapper" id="adminPage">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <a href="index.html" class="logo text-decoration-none text-light">
          <h2 class="logo">🍜 FoodieMenu</h2>
        </a>
        <ul>
          <li class="active">
            <i class="fa-solid fa-utensils"></i> Quản lý món ăn
          </li>
          <li>
            <i class="fa-solid fa-list"></i> Danh mục
          </li>
          <li>
            <i class="fa-solid fa-chart-line"></i> Thống kê
          </li>
          <li onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
          </li>
        </ul>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        <!-- TOP BAR -->
        <div class="top-bar">
          <div>
            <h1>Quản lý món ăn</h1>
            <p>Thêm, sửa, xóa món ăn trong thực đơn</p>
          </div>
          <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#foodModal">
            <i class="fa-solid fa-plus"></i> Thêm món ăn
          </button>
        </div>

        <!-- SEARCH -->
        <div class="search-box mb-4">
          <input type="text" id="searchInput" class="form-control" placeholder="Tìm món ăn..." />
        </div>

        <div id="fetchError" class="text-danger text-center mb-3" style="display: none"></div>

        <!-- LOADING -->
        <div class="text-center my-4" id="loading">
          <div class="spinner-border text-success"></div>
        </div>

        <!-- STATS -->
        <div class="row mb-4 g-3">
          <div class="col-md-4">
            <div class="card bg-success text-white p-3 border-0 rounded-4 shadow-sm">
              <h6>Tổng số món</h6>
              <h2 id="stat-total">0</h2>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-warning text-dark p-3 border-0 rounded-4 shadow-sm">
              <h6>Đang phục vụ</h6>
              <h2 id="stat-available">0</h2>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-danger text-white p-3 border-0 rounded-4 shadow-sm">
              <h6>Đã hết món</h6>
              <h2 id="stat-empty">0</h2>
            </div>
          </div>
        </div>

        <!-- TABLE -->
        <div class="table-responsive">
          <table class="table align-middle table-bordered">
            <thead class="table-success">
              <tr>
                <th>#</th>
                <th>Ảnh</th>
                <th>Tên món</th>
                <th>Danh mục</th>
                <th>Giá</th>
                <th>Trạng thái</th>
                <th>Đánh giá</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="foodTable"></tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- MODAL THÊM/SỬA MÓN -->
    <div class="modal fade" id="foodModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitle" class="modal-title">Thêm món ăn</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="foodForm">
              <div id="formMessage" class="small mb-3"></div>

              <div class="mb-3">
                <label class="form-label">Tên món ăn</label>
                <input type="text" id="TenMon" class="form-control" placeholder="Nhập tên món ăn" />
                <small id="errTenMon" class="text-danger"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">Giá món ăn</label>
                <input type="number" id="Gia" class="form-control" placeholder="Nhập giá món ăn" />
                <small id="errGia" class="text-danger"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">Danh mục</label>
                <select id="DanhMuc" class="form-select">
                  <option value="">Chọn danh mục</option>
                </select>
                <small id="errDanhMuc" class="text-danger"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">Link hình ảnh</label>
                <input type="text" id="HinhAnh" class="form-control" placeholder="Dán link ảnh" />
                <small id="errHinhAnh" class="text-danger"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">Đánh giá</label>
                <input type="number" id="DanhGia" class="form-control" placeholder="1 - 5" min="0" max="5" step="0.1" />
              </div>

              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="isAvailable" checked />
                <label class="form-check-label" for="isAvailable">Còn phục vụ (Bật/Tắt trạng thái)</label>
              </div>

              <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <textarea id="MoTa" class="form-control" rows="4" placeholder="Nhập mô tả món ăn"></textarea>
              </div>

              <button class="btn btn-success w-100">Lưu món ăn</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/admin.js"></script>
  </body>
</html>
